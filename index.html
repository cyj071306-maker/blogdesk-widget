<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>내 상황에 맞는 지원 제도 찾기 (참고용)</title>
<style>
:root{--bg:#ffffff;--fg:#18181b;--muted:#52525b;--line:#e4e4e7;--card:#fafafa;--chip:#f4f4f5;--accent:#2563eb;--accent-fg:#ffffff;
--m-bg:#dcfce7;--m-fg:#166534;--y-bg:#fef3c7;--y-fg:#92400e;--u-bg:#fee2e2;--u-fg:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b0e;--fg:#f4f4f5;--muted:#a1a1aa;--line:#27272a;--card:#18181b;--chip:#27272a;--accent:#60a5fa;--accent-fg:#0b0b0e;
--m-bg:#052e16;--m-fg:#86efac;--y-bg:#451a03;--y-fg:#fcd34d;--u-bg:#450a0a;--u-fg:#fca5a5;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0b0e;--fg:#f4f4f5;--muted:#a1a1aa;--line:#27272a;--card:#18181b;--chip:#27272a;--accent:#60a5fa;--accent-fg:#0b0b0e;
--m-bg:#052e16;--m-fg:#86efac;--y-bg:#451a03;--y-fg:#fcd34d;--u-bg:#450a0a;--u-fg:#fca5a5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
#bdw{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;line-height:1.35;margin:0 0 4px}
h1 small{font-size:13px;font-weight:400;color:var(--muted)}
.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.pv{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:var(--y-bg);color:var(--y-fg);font-size:13px}
.q{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:10px 12px 12px;min-width:0}
.q legend{padding:0 4px;font-weight:600;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt span{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--chip);font-size:13px;line-height:1.3;cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt.skip span{color:var(--muted)}
.opt.skip input:checked+span{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.hint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:500}
#bdw-results{margin:4px 0 12px}
.res-head h2{font-size:17px;margin:0}
.res-head p{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px;margin:0 0 10px}
.card h3{font-size:16px;margin:6px 0 2px;line-height:1.4}
.card p{margin:2px 0;font-size:14px}
.card .meta,.card .unk{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;background:var(--chip);color:var(--muted)}
.tag.m{background:var(--m-bg);color:var(--m-fg)}
.tag.y{background:var(--y-bg);color:var(--y-fg)}
.tag.u{background:var(--u-bg);color:var(--u-fg)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.disc{position:sticky;bottom:0;margin-top:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--muted)}
.disc p{margin:2px 0}
.disc strong{color:var(--fg);font-weight:600}
.disc a{color:var(--accent)}
</style>
</head>
<body>
<div id="bdw">
<h1>내 상황에 맞는 지원 제도 찾기 <small>(참고용)</small></h1>
<div class="empty">아직 확인된 제도가 없습니다. 공식 자료로 확인한 제도부터 차례로 안내할게요.</div>
<footer class="disc">
<p><strong>참고용 안내입니다. 실제 자격은 보조금24·복지로·담당 기관에서 확인하세요.</strong></p>
<p><a href="https://www.gov.kr/portal/rcvfvrSvc/main" target="_blank" rel="noopener noreferrer">보조금24</a> · <a href="https://www.bokjiro.go.kr" target="_blank" rel="noopener noreferrer">복지로</a> · 기준일 2026-10-05</p>
<p>입력한 답은 저장하거나 보내지 않고 이 화면 안에서만 계산해요.</p>
</footer>
</div>
<script>
"use strict";
var bdwHeight = (function heightOnlyBoot() {
    const root = document.getElementById("bdw");
    let lastH = -1;
    function postHeight() {
        if (!root) return;
        const h = Math.ceil(root.getBoundingClientRect().height);
        if (h === lastH) return;
        lastH = h;
        try {
            if (window.parent && window.parent !== window) window.parent.postMessage({
                type: "blogdesk-widget-height",
                height: h
            }, "*");
        } catch  {
        // 무시
        }
    }
    try {
        const m = /[?&]theme=(light|dark)(&|$)/.exec(window.location.search);
        if (m) document.documentElement.setAttribute("data-theme", m[1]);
    } catch  {
    // 무시
    }
    window.addEventListener("resize", postHeight);
    window.addEventListener("load", postHeight);
    postHeight();
});
if (typeof document !== "undefined") bdwHeight();
</script>
</body>
</html>
